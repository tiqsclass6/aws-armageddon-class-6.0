apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: task2-ns
  labels:
    app: app1
    app.kubernetes.io/name: app1
    app.kubernetes.io/part-of: task2-flask-suite
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
        app.kubernetes.io/name: app1
        app.kubernetes.io/part-of: task2-flask-suite
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app1

      containers:
        - name: app1
          image: 866340886126.dkr.ecr.us-east-1.amazonaws.com/app1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: HEALTH_PATH
              value: "/health"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Safe probes: ensure Service gets endpoints (TCP open),
          # then deploy script validates HTTP health path
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3