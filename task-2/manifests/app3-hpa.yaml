apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app3-hpa
  namespace: task2-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app3
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
